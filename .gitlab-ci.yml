include:
  - project: "merixstudio/pts/pipelines"
    ref: "master"
    file: "/Mirror.gitlab-ci.yml"

stages:
  - test
  - trigger
  - mirror

test:
  stage: test
  image: python:3.12
  before_script:
    - pip install uv
    - uv sync --extra dev
  script:
    - uv run pytest coldfront_billing/tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

mirror:
  needs: []
  rules:
    - if: $MIRROR_ENABLED == "1" && $CI_PIPELINE_SOURCE == "schedule"
      when: always

trigger-plugin-test:
  stage: trigger
  trigger:
    project: merixstudio/tufts/plugin-test-project
    branch: main
    strategy: depend
  variables:
    COLDFRONT_BILLING_BRANCH: $CI_COMMIT_REF_NAME
