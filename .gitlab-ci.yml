include:
  - project: "merixstudio/pts/pipelines"
    ref: "master"
    file: "/Mirror.gitlab-ci.yml"

stages:
  - test
  - trigger
  - mirror

test:
  stage: test
  image: python:3.11
  before_script:
    - pip install uv
    - uv pip install --system -e ".[dev]"
    - uv pip install --system "coldfront>=1.1.7,<2"
    - uv pip install --system pytest pytest-django
  script:
    - |
      export DJANGO_SETTINGS_MODULE=coldfront.config.settings
      export DB_ENGINE=django.db.backends.sqlite3
      export DB_NAME=:memory:
      export SECRET_KEY=test-secret-key-for-ci
      export DEBUG=False
      pytest coldfront_billing/tests/ -v --tb=short
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

mirror:
  needs: []
  rules:
    - if: $MIRROR_ENABLED == "1" && $CI_PIPELINE_SOURCE == "schedule"
      when: always

trigger-plugin-test:
  stage: trigger
  trigger:
    project: merixstudio/tufts/plugin-test-project
    branch: main
    strategy: depend
  variables:
    COLDFRONT_BILLING_BRANCH: $CI_COMMIT_REF_NAME
