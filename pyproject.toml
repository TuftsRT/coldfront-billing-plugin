[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coldfront-billing"
version = "0.0.1"
requires-python = ">=3.9"
authors = [
    { name = "Merixstudio" }
]
description = "Coldfront Billing Plugin"
readme = "README.md"
license = "MIT"
keywords = ["high-performance-computing", "resource-allocation", "billing"]
classifiers = [
    'Programming Language :: Python :: 3',
    'Framework :: Django :: 4.2',
]
dependencies = [
    "coldfront>=1.1.7,<2",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "ruff",
    "pytest",
    "pytest-django",
]

[tool.hatch.build.targets.wheel]
packages = ["coldfront_billing"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "Q", "S308"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true
quote-style = "single"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "coldfront.config.settings"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
]
markers = [
    "django_db: marks tests as requiring database access",
]
testpaths = ["coldfront_billing/tests"]