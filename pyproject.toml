[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coldfront-billing"
version = "3.0.0"
requires-python = ">=3.10"
authors = [
    { name = "Merixstudio" },
    { name = "Chris Barnett", email = "christopher.barnett@tufts.edu"}
]
description = "Coldfront Billing Plugin"
readme = "README.md"
keywords = ["high-performance-computing", "resource-allocation", "billing"]
classifiers = [
    'Programming Language :: Python :: 3',
    'Framework :: Django :: 5.2',
]
dependencies = [
    "coldfront>=1.1.8,<2",
    # the release with allocation_request; the fork's override-dependencies pins the same tag, since uv
    # allows one URL per package across all the plugins
    "coldfront_utils@git+https://github.com/Tufts-Technology-Services/coldfront-utils.git@v0.3.1",
    "email-validator>=2.3.0",
    "pydantic>=2.0.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["coldfront_billing"]

[tool.hatch.metadata]
# coldfront_utils is only published as a git URL.
allow-direct-references = true

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"  # the oldest Python in requires-python

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "S308", "S113"]

[tool.ruff.lint.isort]
# coldfront's imports get a section of their own, between third-party and this package's
sections = { "coldfront-main" = ["coldfront"] }
section-order = ["future", "standard-library", "third-party", "coldfront-main", "first-party", "local-folder"]

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true

[tool.pylint.messages_control]
disable = [
    "C0411" # Wrong import order
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "coldfront_billing.tests.settings"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short"
]
markers = [
    "django_db: marks tests as requiring database access",
]
testpaths = ["coldfront_billing/tests"]

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
    "pytest",
    "pytest-django",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]
